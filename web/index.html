<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage — adaptive GMAT/GRE quant tutor</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --ink:#1a1a18; --muted:#8a8782; --accent:#2f6f4f;
    --border:#e7e4de; --radius:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
  .box { width:100%; max-width:400px; text-align:center; }
  .brand { font-size:15px; font-weight:600; color:var(--accent); margin-bottom:28px; }
  .brand .leaf { margin-right:6px; }
  h1 { font-size:30px; letter-spacing:-0.6px; line-height:1.2; margin-bottom:10px; }
  .sub { color:var(--muted); font-size:15px; line-height:1.55; margin-bottom:26px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.04); text-align:left; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:7px; }
  input { width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:10px;
    font-family:inherit; font-size:15px; margin-bottom:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; padding:14px; border:none; border-radius:10px; background:var(--accent);
    color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.5; }
  #err { display:none; color:#b4452f; font-size:12.5px; margin-bottom:10px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <main>
    <div class="box">
      <div class="brand"><span class="leaf">●</span>Sage</div>
      <h1>Ready to practice?</h1>
      <p class="sub">Ten adaptive GMAT/GRE quant questions that adjust to how you answer. Your email saves your progress and tailors future sprints to you.</p>
      <div class="card">
        <label for="name">Your name</label>
        <input id="name" placeholder="e.g. Alex" autocomplete="given-name">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@email.com" autocomplete="email"
               onkeydown="if(event.key==='Enter')start()">
        <div id="err">Enter your name and a valid email to begin.</div>
        <button id="btn" onclick="start()">Start sprint →</button>
      </div>
    </div>
  </main>
  <footer>
    Built on RocketRide · Butterbase · XTrace · Photon —
    <a href="/about.html">how it works</a>
  </footer>
<script>
function start() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const ok = name && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
  if (!ok) {
    document.getElementById("err").style.display = "block";
    (name ? document.getElementById("email") : document.getElementById("name")).focus();
    return;
  }
  // Hand off via sessionStorage so the email never rides in the URL.
  sessionStorage.setItem("sage_start", JSON.stringify({ name, email }));
  location.href = "/sprint.html";
}
</script>
</body>
</html>
